name: Update profile assets

on:
  # Refresh the contribution graph and statistics every 8 hours (UTC).
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-profile-assets.yml"
      - "README.md"
      - "profile.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE_USER: ${{ github.repository_owner }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            resource/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch public GitHub statistics
        run: python scripts/fetch_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render light and dark profile cards
        run: python scripts/build_profile.py

      - name: Validate generated cards
        run: python scripts/build_profile.py --check

      - name: Commit updated profile assets
        shell: bash
        run: |
          set -euo pipefail
          generated_from=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/ resource/github-contribution-grid-snake.svg
          if git diff --cached --quiet; then
            echo "The profile assets are already up to date."
            exit 0
          fi
          git commit -m "chore: update profile assets"

          # Retry normal pushes after unrelated main-branch edits. Never force-push
          # or overwrite a concurrent change to the inputs or generated assets.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch --no-tags origin main
            # A lost response may hide an already successful push.
            if git merge-base --is-ancestor HEAD origin/main; then
              exit 0
            fi
            if ! git diff --quiet "$generated_from"...origin/main -- \
                README.md profile.json scripts/ assets/ \
                resource/github-contribution-grid-snake.svg \
                .github/workflows/update-profile-assets.yml; then
              echo "::error::Profile inputs or assets changed during generation. Run this workflow again to use the latest version."
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Could not push profile assets after three attempts."
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Concurrent edits prevented a clean rebase; existing remote content was preserved."
              exit 1
            fi
            python scripts/build_profile.py --check
            sleep "$((attempt * 2))"
          done
