name: Update profile assets

on:
  # Refresh the contribution graph and statistics every 8 hours (UTC).
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-profile-assets.yml"
      - ".github/scripts/update_profile_assets.py"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Cache the coding animation
        shell: bash
        run: |
          mkdir -p resource
          if [[ ! -f resource/coding.gif ]]; then
            curl --fail --location --retry 3 --max-time 60 \
              --output resource/coding.gif \
              "https://raw.githubusercontent.com/sun0225SUN/sun0225SUN/0932267e63de9865b2bd9af9a1fee517e72c297e/assets/images/coding.gif"
          fi

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            resource/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub statistics
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: github
          AUTO_PUSH: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and stage fresh cards
        run: python .github/scripts/update_profile_assets.py
        env:
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit updated profile assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- resource/coding.gif resource/github-contribution-grid-snake.svg resource/profile-summary
          if git diff --cached --quiet; then
            echo "The profile assets are already up to date."
            exit 0
          fi
          git commit -m "chore: update profile assets"
          git pull --rebase origin main
          git push origin HEAD:main
