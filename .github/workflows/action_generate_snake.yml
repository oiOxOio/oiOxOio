name: generate snake animation

on:
  # Refresh the contribution graph every 8 hours (UTC).
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            resource/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated animation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- resource/github-contribution-grid-snake.svg
          if git diff --cached --quiet; then
            echo "The contribution animation is already up to date."
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
