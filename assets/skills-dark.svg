<title id="title">正在建设与探索的方向</title>
<desc id="desc">规则引擎 &amp; CPQ：围绕 dx-cloud 规则引擎，探索非标模架报价、参数配置与价格计算。；数据平台 &amp; 服务端：关注结构化数据、版本记录与服务边界，让业务规则可维护，执行过程可追溯。；Web 3D &amp; 互动体验：抽陀螺 Web 3D：交互反馈、光影材质，以及移动端性能与加载体验。；AI 工具 &amp; 可视化：维护 Codex 插件，探索 CAD / CNC / EIA刀路可视化与自动化开发流程。</desc>
