<text x="24" y="37" class="mono" font-size="11" font-weight="400" fill="#7dd3fc" letter-spacing="1.4">FOCUS &amp; PRACTICE</text>
<rect x="24" y="59" width="372" height="120" rx="10" fill="#121923" stroke="none" />
<text x="40" y="84" class="mono" font-size="10.5" font-weight="400" fill="#7dd3fc" >01</text>
<text x="380" y="84" class="sans" font-size="10.5" font-weight="400" fill="#7d8da1" text-anchor="end">体验与实现</text>
<text x="40" y="112" class="sans" font-size="16" font-weight="600" fill="#e6edf3" >全栈构建</text>
<text x="40" y="137" class="sans" font-size="13" font-weight="400" fill="#9aaabd" >从界面交互到服务端逻辑，</text>
<text x="40" y="158" class="sans" font-size="13" font-weight="400" fill="#9aaabd" >关注端到端体验与实现质量。</text>
<rect x="24" y="194" width="372" height="120" rx="10" fill="#121923" stroke="none" />
<text x="40" y="219" class="mono" font-size="10.5" font-weight="400" fill="#7dd3fc" >02</text>
<text x="380" y="219" class="sans" font-size="10.5" font-weight="400" fill="#7d8da1" text-anchor="end">简洁与取舍</text>
<text x="40" y="247" class="sans" font-size="16" font-weight="600" fill="#e6edf3" >架构思考</text>
<text x="40" y="272" class="sans" font-size="13" font-weight="400" fill="#9aaabd" >先理清边界与约束，</text>
<text x="40" y="293" class="sans" font-size="13" font-weight="400" fill="#9aaabd" >再权衡复杂度、可靠性与维护成本。</text>
<rect x="24" y="329" width="372" height="120" rx="10" fill="#121923" stroke="none" />
<text x="40" y="354" class="mono" font-size="10.5" font-weight="400" fill="#7dd3fc" >03</text>
<text x="380" y="354" class="sans" font-size="10.5" font-weight="400" fill="#7d8da1" text-anchor="end">可靠与交付</text>
<text x="40" y="382" class="sans" font-size="16" font-weight="600" fill="#e6edf3" >工程落地</text>
<text x="40" y="407" class="sans" font-size="13" font-weight="400" fill="#9aaabd" >关注构建、部署与运行链路，</text>
<text x="40" y="428" class="sans" font-size="13" font-weight="400" fill="#9aaabd" >让每次迭代都可验证、可维护。</text>
<rect x="24" y="464" width="372" height="120" rx="10" fill="#121923" stroke="none" />
<text x="40" y="489" class="mono" font-size="10.5" font-weight="400" fill="#7dd3fc" >04</text>
<text x="380" y="489" class="sans" font-size="10.5" font-weight="400" fill="#7d8da1" text-anchor="end">原理与实践</text>
<text x="40" y="517" class="sans" font-size="16" font-weight="600" fill="#e6edf3" >技术深挖</text>
<text x="40" y="542" class="sans" font-size="13" font-weight="400" fill="#9aaabd" >不止关注技术如何使用，</text>
<text x="40" y="563" class="sans" font-size="13" font-weight="400" fill="#9aaabd" >也乐于探索底层机制与不同方案的取舍。</text>
