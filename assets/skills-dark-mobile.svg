<svg xmlns="http://www.w3.org/2000/svg" width="420" height="880" viewBox="0 0 420 880" role="img" aria-labelledby="title desc">
<title id="title">技术方向与开发习惯</title>
<desc id="desc">前端开发：关注清晰的界面与自然的交互，重视响应式布局、性能和使用体验。；后端开发：围绕接口、数据与服务组织代码，兼顾稳定性、扩展性和可维护性。；工程实践：重视代码结构、版本管理与自动化，让开发、部署和维护更顺畅。；持续学习：保持对新技术与开发工具的好奇，在实践中验证，持续改进工作方式。。技术选择：Java / Spring Boot / PostgreSQL；Vue / shadcn；Kubernetes / Docker；ChatGPT / Codex。AI 偏好：目标清晰、上下文充分、结果可验证</desc>
